<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3c9"><meta name="apple-mobile-web-app-capable" content="yes">
<title>3しまいの なつやすみチャレンジ</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fffaf1;--card:#fff;--ink:#3d3934;--muted:#766f66;--line:#eadfce;--hina:#ffdce8;--oto:#dff5ff;--green:#dff6df;--shadow:0 9px 25px #4f3d2018}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(#fff7d8,#fffaf4 42%,#f4fbff)}
button,input,select{font:inherit}button{cursor:pointer}#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
header{padding:20px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffffffc9;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{margin:3px 0;font-size:clamp(25px,4vw,40px)}h2,h3{margin-top:0}.tiny{font-size:13px;color:var(--muted);font-weight:800}.parent{border:0;border-radius:15px;background:#44403a;color:#fff;padding:12px 15px;font-weight:900}
main{max-width:1050px;margin:auto;padding:18px}.wallets{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wallet{border-radius:18px;padding:16px;box-shadow:var(--shadow);font-size:18px}.wallet strong{float:right;font-size:22px}.hina{background:var(--hina)}.oto{background:var(--oto)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}.tab{border:2px solid transparent;background:#fff;border-radius:17px;padding:14px 8px;box-shadow:var(--shadow);font-weight:900}.tab.active{border-color:#555;transform:translateY(-2px)}
.titlebar{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff;padding:10px 14px;border-radius:15px;font-weight:900;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mission{display:grid;grid-template-columns:52px 1fr 34px;gap:12px;align-items:center;min-height:96px;border:2px solid transparent;border-radius:20px;padding:15px;background:#fff;text-align:left;box-shadow:var(--shadow)}.mission .e{font-size:34px}.kind{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}.txt{font-size:18px;font-weight:900;line-height:1.35}.check{width:31px;height:31px;border:3px solid #d3c8b8;border-radius:50%;display:grid;place-items:center;font-weight:900}.mission.done{background:var(--green);border-color:#68b96c}.mission.done .txt{text-decoration:line-through}.mission.done .check{background:#68b96c;color:#fff;border-color:#68b96c}
.box,.detail,.psec{margin-top:18px;padding:17px;border-radius:19px;background:#fff;box-shadow:var(--shadow)}.bonus{border:3px dashed #e6af42}.award{background:linear-gradient(135deg,#fff8ca,#ffe5a0)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.small{border:0;border-radius:11px;padding:8px 10px;font-weight:800}.small.done{background:#69c36e;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.soft{border:0;background:#fff;border-radius:13px;padding:11px 14px;box-shadow:var(--shadow);font-weight:800}.hidden{display:none!important}
.calhead{display:flex;justify-content:center;align-items:center;gap:16px}.calhead button{border:0;background:#fff;border-radius:11px;padding:9px 13px;box-shadow:var(--shadow)}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week span{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:8px}.day{min-height:76px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 13px #4f3d2015;padding:8px;display:flex;flex-direction:column;align-items:flex-start}.day.blank{visibility:hidden}.day.today{outline:3px solid #74aef0}.day.full{background:#fff2a9}.day.some{background:#edf8ff}.marks{margin-top:auto}
dialog{border:0;border-radius:22px;width:min(680px,calc(100% - 22px));max-height:92vh;padding:0;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#251f1a99}.dialog{position:relative;padding:22px;overflow:auto;max-height:92vh}.close{position:absolute;right:13px;top:13px;border:0;border-radius:50%;width:37px;height:37px}.dialog input,.dialog select{width:100%;padding:12px;border:2px solid #ddd2c2;border-radius:12px;margin-top:5px}.dialog label{display:block;font-weight:800;margin:11px 0}.primary,.danger{width:100%;border:0;border-radius:13px;padding:12px;font-weight:900}.primary{background:#397ae6;color:#fff}.danger{background:#d74a4a;color:#fff}.error{color:#c42d2d;font-weight:800}.psec{box-shadow:none;border:1px solid var(--line)}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detailcard{background:#f8f8f8;border-radius:14px;padding:13px}
@media(max-width:700px){header{align-items:center}.parent{font-size:13px;padding:10px}.wallets{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}.tabs button:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}}
</style></head>
<body><canvas id="confetti"></canvas>
<header><div><div class="tiny">3しまいで ちからを あわせよう</div><h1>🌞 なつやすみチャレンジ</h1><strong id="today"></strong></div><button class="parent" id="parentOpen">🔒 パパ・ママ</button></header>
<main>
<section class="wallets"><div class="wallet hina">🌸 ひなねのおさいふ <strong id="wh">0えん</strong></div><div class="wallet oto">🫧 おとねのおさいふ <strong id="wo">0えん</strong></div></section>
<section class="tabs"><button class="tab active" data-child="hinane">🌸 ひなね <span id="th">0/10</span></button><button class="tab" data-child="otone">🫧 おとね <span id="to">0/5</span></button><button class="tab" id="calTab">📅 カレンダー</button></section>
<section id="missionView"><div class="titlebar"><div><div class="tiny">きょうの ミッション</div><h2 id="childTitle"></h2></div><div class="badge" id="badge"></div></div><div class="grid" id="missions"></div>
<section class="box bonus hidden" id="bonusBox"><h3>🌟 パパ・ママからの ミッション</h3><div id="bonusList"></div></section>
<section class="box award hidden" id="awardBox"><h3>🏅 きょうの とくべつしょう</h3><div id="awardList"></div></section>
<div class="actions"><button class="soft" id="reroll">🎲 えらびなおす</button><button class="soft" id="reset">↩ チェックを もどす</button></div></section>
<section id="calendarView" class="hidden"><div class="calhead"><button id="prev">◀</button><h2 id="monthTitle"></h2><button id="next">▶</button></div><div class="week"><span>にち</span><span>げつ</span><span>か</span><span>すい</span><span>もく</span><span>きん</span><span>ど</span></div><div class="cal" id="cal"></div><div class="detail" id="detail">ひづけを おすと、がんばった きろくが みられます。</div></section>
</main>
<dialog id="parentDialog"><form method="dialog" class="dialog"><button class="close" value="cancel">✕</button>
<div id="login"><h2>🔒 パパ・ママモード</h2><p>あいことばを いれてください。</p><input id="pin" type="password" inputmode="numeric" maxlength="6"><button type="button" class="primary" id="loginBtn">はいる</button><p class="error" id="pinError"></p></div>
<div id="parentPane" class="hidden"><h2>👨‍👩‍👧 パパ・ママモード</h2>
<section class="psec"><h3>🌟 きょうだけの ミッション</h3><label>だれに？<select id="bc"><option value="hinane">ひなね</option><option value="otone">おとね</option></select></label><label>ミッション<input id="bt" placeholder="れい：くつを そろえる"></label><button type="button" class="primary" id="addBonus">ミッションを だす</button></section>
<section class="psec"><h3>🏅 とくべつしょう</h3><label>だれに？<select id="ac"><option value="hinane">ひなね</option><option value="otone">おとね</option></select></label><label>しょう<select id="at"><option>おはなしを よく きけたで しょう</option><option>なかよく あそべたで しょう</option><option>やさしく できたで しょう</option><option>おてつだいを がんばったで しょう</option><option>あきらめずに がんばったで しょう</option><option>いもうとに やさしく できたで しょう</option></select></label><button type="button" class="primary" id="addAward">しょうを おくる</button></section>
<section class="psec"><h3>👛 おさいふから つかう</h3><label>だれ？<select id="sc"><option value="hinane">ひなね</option><option value="otone">おとね</option></select></label><label>なんえん？<input id="sa" type="number" min="10" step="10" inputmode="numeric"></label><label>なにに つかった？<input id="sm" placeholder="れい：アイス"></label><button type="button" class="danger" id="spend">おさいふから ひく</button><p class="error" id="spendError"></p></section>
<section class="psec"><h3>📒 きょうの きろく</h3><div id="summary"></div></section></div></form></dialog>
<script>
const PIN="823",C={
hinane:{name:"ひなね",emoji:"🌸",goal:10,fixed:[["📚","がっこうの なつやすみの しゅくだいを する","まいにち"],["🧺","せんたくものを とりいれる","まいにち"],["🪥","はみがきを する","まいにち"]],suzu:["👶","すずねに やさしく こえを かける","すずねミッション"],random:[["📖","ほんを 10ぷん よむ","べんきょう"],["✏️","ひらがなを 5もじ かく","べんきょう"],["🔢","たしざんを 5もん とく","べんきょう"],["🧹","へやを 5ふん そうじする","おてつだい"],["👕","せんたくものを たたむ","おてつだい"],["🍚","ごはんを ならべる","おてつだい"],["🥒","りょうりの おてつだいを する","おてつだい"],["🧸","おもちゃを かたづける","おてつだい"],["🌱","はなや くさに みずを あげる","おてつだい"],["🎨","えを 1まい かく","つくる"],["🧩","パズルを する","あそび"],["🧱","ブロックで なにかを つくる","あそび"],["⚽","ボールで 10ぷん あそぶ","からだ"],["🤸","ストレッチを する","からだ"],["🕺","すきな うたで おどる","からだ"],["🌿","はっぱを 3しゅるい みつける","たんけん"],["🐜","むしを 1ぴき みつける","たんけん"],["💌","だれかに ありがとうを いう","やさしいこと"],["🧡","いもうとに やさしくする","やさしいこと"],["🌙","あしたの じゅんびを する","せいかつ"]]},
otone:{name:"おとね",emoji:"🫧",goal:5,fixed:[["🪥","はみがきを する","まいにち"],["🧸","おもちゃを かたづける","まいにち"]],suzu:["👶","すずねを にこにこ みまもる","すずねミッション"],random:[["📖","えほんを 1さつ みる","ことば"],["🎨","すきな いろで えを かく","つくる"],["🖍️","ぬりえを する","つくる"],["🧱","ブロックを つむ","あそび"],["🎵","すきな うたを うたう","あそび"],["💃","うたに あわせて おどる","からだ"],["🐰","うさぎジャンプを 5かい する","からだ"],["👏","てを 10かい たたく","からだ"],["🌼","おはなを 1つ みつける","たんけん"],["🐜","むしを 1ぴき みつける","たんけん"],["🔴","あかいものを 3こ さがす","たんけん"],["⭕","まるいものを 3こ さがす","たんけん"],["🍙","おにぎりを にぎる","りょうり"],["🥄","スプーンを ならべる","おてつだい"],["🌱","みずやりを する","おてつだい"],["🤗","かぞくに ぎゅっとする","やさしいこと"],["👋","げんきに あいさつする","やさしいこと"]]}}
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,"0"),now=new Date(),dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,todayKey=dk(now);let child=localStorage.sc_child||"hinane",cursor=new Date(now.getFullYear(),now.getMonth(),1);
const r=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},w=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const tk=(c,d=todayKey)=>`sc_t_${d}_${c}`,dk2=(c,d=todayKey)=>`sc_d_${d}_${c}`,bk=(d=todayKey)=>`sc_b_${d}`,ak=(d=todayKey)=>`sc_a_${d}`,ek=(c,d=todayKey)=>`sc_e_${d}_${c}`,wk=c=>`sc_w_${c}`;
function make(c){let x=C[c],n=x.goal-x.fixed.length-1;return [...x.fixed,x.suzu,...sh(x.random).slice(0,n)].map((v,i)=>({id:"t"+i,emoji:v[0],text:v[1],kind:v[2]}))}
function tasks(c,d=todayKey){let x=r(tk(c,d),null);if(!x&&d===todayKey){x=make(c);w(tk(c,d),x)}return x||[]}function done(c,d=todayKey){return new Set(r(dk2(c,d),[]))}function setdone(c,s,d=todayKey){w(dk2(c,d),[...s])}function wallet(c){return +(localStorage.getItem(wk(c))||0)}function setw(c,v){localStorage.setItem(wk(c),v)}function bonus(d=todayKey){return r(bk(d),[])}function awards(d=todayKey){return r(ak(d),[])}function prog(c,d=todayKey){return done(c,d).size}
function earn(c){if(prog(c)>=C[c].goal&&localStorage.getItem(ek(c))!=="yes"){localStorage.setItem(ek(c),"yes");setw(c,wallet(c)+10);burst()}}
function snap(){let h=r("sc_history",{});h[todayKey]={hinane:{done:prog("hinane"),goal:10,tasks:tasks("hinane"),doneIds:[...done("hinane")]},otone:{done:prog("otone"),goal:5,tasks:tasks("otone"),doneIds:[...done("otone")]},bonus:bonus(),awards:awards(),wallets:{hinane:wallet("hinane"),otone:wallet("otone")}};w("sc_history",h)}
function render(){$("today").textContent=`${now.getMonth()+1}がつ ${now.getDate()}にち`;$("wh").textContent=wallet("hinane")+"えん";$("wo").textContent=wallet("otone")+"えん";$("th").textContent=`${prog("hinane")}/10`;$("to").textContent=`${prog("otone")}/5`;$("childTitle").textContent=`${C[child].emoji} ${C[child].name}の ミッション`;$("badge").textContent=`${prog(child)} / ${C[child].goal}`;document.querySelectorAll("[data-child]").forEach(b=>b.classList.toggle("active",b.dataset.child===child));let d=done(child);$("missions").innerHTML="";tasks(child).forEach(t=>{let b=document.createElement("button");b.className="mission "+(d.has(t.id)?"done":"");b.innerHTML=`<span class=e>${t.emoji}</span><span><span class=kind>${t.kind}</span><span class=txt>${t.text}</span></span><span class=check>${d.has(t.id)?"✓":""}</span>`;b.onclick=()=>{let s=done(child);s.has(t.id)?s.delete(t.id):s.add(t.id);setdone(child,s);earn(child);snap();render()};$("missions").appendChild(b)});let bs=bonus().filter(x=>x.child===child);$("bonusBox").classList.toggle("hidden",!bs.length);$("bonusList").innerHTML="";bs.forEach(i=>{let row=document.createElement("div");row.className="row";row.innerHTML=`<strong>${i.done?"✅":"🌟"} ${i.text}</strong>`;let b=document.createElement("button");b.className="small "+(i.done?"done":"");b.textContent=i.done?"できた！":"できた";b.onclick=()=>{let a=bonus(),q=a.find(x=>x.id===i.id);if(q)q.done=!q.done;w(bk(),a);snap();render()};row.appendChild(b);$("bonusList").appendChild(row)});let as=awards().filter(x=>x.child===child);$("awardBox").classList.toggle("hidden",!as.length);$("awardList").innerHTML=as.map(x=>`<div class=row><strong>🏅 ${x.text}</strong></div>`).join("");snap();summary()}
document.querySelectorAll("[data-child]").forEach(b=>b.onclick=()=>{child=b.dataset.child;localStorage.sc_child=child;$("missionView").classList.remove("hidden");$("calendarView").classList.add("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});$("calTab").onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$("calTab").classList.add("active");$("missionView").classList.add("hidden");$("calendarView").classList.remove("hidden");cal()}
$("reroll").onclick=()=>{if(confirm("きょうの ミッションを えらびなおしますか？")){w(tk(child),make(child));localStorage.removeItem(dk2(child));localStorage.removeItem(ek(child));snap();render()}};$("reset").onclick=()=>{if(confirm("チェックを ぜんぶ もどしますか？")){localStorage.removeItem(dk2(child));snap();render()}}
$("parentOpen").onclick=()=>{$("parentDialog").showModal();$("login").classList.remove("hidden");$("parentPane").classList.add("hidden");$("pin").value="";$("pinError").textContent=""};$("loginBtn").onclick=()=>{if($("pin").value===PIN){$("login").classList.add("hidden");$("parentPane").classList.remove("hidden");summary()}else $("pinError").textContent="あいことばが ちがいます。"}
$("addBonus").onclick=()=>{let t=$("bt").value.trim();if(!t)return;let a=bonus();a.push({id:String(Date.now()),child:$("bc").value,text:t,done:false});w(bk(),a);$("bt").value="";snap();render()};$("addAward").onclick=()=>{let a=awards();a.push({id:String(Date.now()),child:$("ac").value,text:$("at").value});w(ak(),a);snap();render()}
$("spend").onclick=()=>{let c=$("sc").value,a=+$("sa").value,m=$("sm").value.trim()||"おかいもの";if(!a||a<10||a%10){$("spendError").textContent="10えんたんいで いれてください。";return}if(a>wallet(c)){$("spendError").textContent="おさいふの おかねが たりません。";return}setw(c,wallet(c)-a);let h=r("sc_spend",[]);h.push({date:todayKey,child:c,amount:a,memo:m});w("sc_spend",h);$("sa").value="";$("sm").value="";$("spendError").textContent="";snap();render()}
function summary(){$("summary").innerHTML=`<p>🌸 ひなね：${prog("hinane")}/10　${wallet("hinane")}えん</p><p>🫧 おとね：${prog("otone")}/5　${wallet("otone")}えん</p><p>🌟 ついかミッション：${bonus().length}こ</p><p>🏅 とくべつしょう：${awards().length}こ</p>`}
$("prev").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);cal()};$("next").onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);cal()}
function cal(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h=r("sc_history",{});$("monthTitle").textContent=`${y}ねん ${m+1}がつ`;$("cal").innerHTML="";for(let i=0;i<first;i++){let x=document.createElement("div");x.className="day blank";$("cal").appendChild(x)}for(let d=1;d<=days;d++){let key=dk(new Date(y,m,d)),v=h[key],b=document.createElement("button");b.className="day"+(key===todayKey?" today":"");if(v)b.classList.add(v.hinane.done>=10&&v.otone.done>=5?"full":(v.hinane.done||v.otone.done?"some":""));let marks=v?`${v.hinane.done>=10?"🌸":v.hinane.done?"◐":""}${v.otone.done>=5?"🫧":v.otone.done?"◐":""}${v.awards?.length?"🏅":""}`:"";b.innerHTML=`<strong>${d}</strong><span class=marks>${marks}</span>`;b.onclick=()=>detail(key,v);$("cal").appendChild(b)}}
function detail(key,h){let[,m,d]=key.split("-");if(!h){$("detail").innerHTML=`<h3>${+m}がつ ${+d}にち</h3><p>まだ きろくが ありません。</p>`;return}let list=c=>{let ids=new Set(h[c].doneIds||[]);return(h[c].tasks||[]).filter(t=>ids.has(t.id)).map(t=>`<li>${t.emoji} ${t.text}</li>`).join("")||"<li>なし</li>"},as=(h.awards||[]).map(a=>`<li>${C[a.child].emoji} ${C[a.child].name}：${a.text}</li>`).join("")||"<li>なし</li>",bs=(h.bonus||[]).filter(b=>b.done).map(b=>`<li>${C[b.child].emoji} ${C[b.child].name}：${b.text}</li>`).join("")||"<li>なし</li>";$("detail").innerHTML=`<h3>${+m}がつ ${+d}にちの きろく</h3><div class=detailgrid><div class=detailcard><h4>🌸 ひなね ${h.hinane.done}/10</h4><ul>${list("hinane")}</ul></div><div class=detailcard><h4>🫧 おとね ${h.otone.done}/5</h4><ul>${list("otone")}</ul></div></div><h4>🌟 できた ついかミッション</h4><ul>${bs}</ul><h4>🏅 とくべつしょう</h4><ul>${as}</ul>`}
function burst(){let c=$("confetti"),x=c.getContext("2d"),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.scale(d,d);let cols=["#ff7f96","#68baf1","#ffd85d","#7bd184","#ad8cf4"],p=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight*.24,vx:(Math.random()-.5)*12,vy:-4-Math.random()*8,g:.26,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*5)]})),f=0;(function z(){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(q=>{q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.r,q.r)});if(f++<140)requestAnimationFrame(z)})()}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));render();
</script></body></html>
